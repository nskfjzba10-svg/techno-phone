<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تكنو فون — بيع وصيانة الأجهزة الذكية</title>
    <meta
      name="description"
      content="منصة تكنو فون لبيع أحدث الأجهزة الذكية وخدمات الصيانة المعتمدة بقطع غيار أصلية وتتبع فوري لحالة الإصلاح."
    />
    <meta property="og:title" content="تكنو فون — بيع وصيانة الأجهزة الذكية" />
    <meta
      property="og:description"
      content="منصة تكنو فون لبيع أحدث الأجهزة الذكية وخدمات الصيانة المعتمدة بقطع غيار أصلية وتتبع فوري لحالة الإصلاح."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('technophone_theme_v1');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8F9FA] dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-700 selection:text-white transition-colors duration-150">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
